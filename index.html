<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>BiteSync — Smart Kitchen & Macros Studio</title>
    <meta name="description" content="BiteSync: Bento Box culinary dashboard, world recipes, Open Food Facts scanner, weekly meal planner and smart macro tracker." />
    
    <!-- PWA & Mobile Web App Meta Tags (Android & iOS) -->
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="BiteSync — Smart Kitchen & Macros Studio" />
    <meta property="og:description" content="BiteSync: Bento Box culinary dashboard, world recipes, Open Food Facts scanner, weekly meal planner and smart macro tracker." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
